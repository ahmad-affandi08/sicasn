x-aplikasi: &aplikasi
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
  image: sicasn-app
  env_file: .env
  environment:
    DB_HOST: mysql
    DB_PORT: "3306"
  volumes:
    - ./.env:/var/www/html/.env
    - penyimpanan:/var/www/html/storage
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *aplikasi
    command: ["sh", "-c", "php artisan migrate --force && php artisan sicasn:muat-soal && exec php-fpm"]
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: sicasn-web
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    <<: *aplikasi
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--backoff=30", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *aplikasi
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - data-mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  penyimpanan:
  data-mysql:
